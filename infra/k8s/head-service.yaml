# Fixed NodePort for the Ray head so kind can map it to 127.0.0.1:8265.
# Port 8265 serves the Ray dashboard and the job submission API
# (`ray job submit --address http://127.0.0.1:8265`).
apiVersion: v1
kind: Service
metadata:
  name: ray-head-nodeport
spec:
  type: NodePort
  selector:
    ray.io/cluster: ray
    ray.io/node-type: head
  ports:
    - name: dashboard
      port: 8265
      targetPort: 8265
      nodePort: 30265
